      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background circular badge -->
  <rect width="32" height="32" rx="8" fill="#020617" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Flowing Water Droplet -->
  <path d="M16 4 C16 4 7 14.5 7 20 C7 25 11 28 16 28 C21 28 25 25 25 20 C25 14.5 16 4 16 4 Z" fill="url(#dropGrad)" />
  
  <!-- Highlight Reflection -->
