[package]
name = "tiririka-program"
version = "0.1.0"
description = "Tiririka: Pay-Per-Litre Water Kiosk Payment Channel Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tiririka_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
solana-program = ">=1.18, <2"
